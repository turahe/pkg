version: "2"

linters:
  enable:
    - bodyclose
    - exhaustive
    - gosec
    - misspell
    - noctx
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: false
    gosec:
      excludes:
        - G115 # integer overflow (acceptable in our code)
    govet:
      enable-all: true
      disable:
        - fieldalignment # not a correctness issue
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files get relaxed rules.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # Generated or example code.
      - path: cmd/example
        linters:
          - gosec # demo uses log.Fatal which is fine for examples
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
