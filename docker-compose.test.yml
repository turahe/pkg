# docker-compose.test.yml — self-contained unit/integration test runner.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.test.yml down -v
#
# Or via Makefile:
#   make test-docker
#
# The `test` service waits for all dependencies to be healthy (via `depends_on`
# condition: service_healthy), then runs the full unit/integration suite with
# race+coverage, followed by package benchmarks, and exits.
# The compose process exits with the test runner's exit code.
#
# Redis and Valkey are both started so redis package integration tests can
# use either (REDIS_HOST/REDIS_PORT and VALKEY_HOST/VALKEY_PORT).

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  valkey:
    image: valkey/valkey:7-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.83
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # alpha.83 serves /health/ready as AccessDenied without SigV4; any HTTP response means the API is up.
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Test runner ────────────────────────────────────────────────────────────
  test:
    image: golang:1.26-alpine
    working_dir: /app

    # Mount the project source; do NOT copy — changes are reflected instantly.
    volumes:
      - .:/app
      # Named volume keeps the module cache across runs for faster re-runs.
      - go-mod-cache:/go/pkg/mod

    # All environment variables the test suite reads.
    environment:
      # Redis (used by app and by redis integration tests when in Docker)
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Valkey (used by redis integration tests to try Redis or Valkey)
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"

      # Primary database (MySQL)
      DATABASE_DRIVER: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      DATABASE_DBNAME: testdb

      # Secondary database for *_SITE tests (Postgres)
      DATABASE_DRIVER_SITE: postgres
      DATABASE_HOST_SITE: postgres
      DATABASE_PORT_SITE: "5432"
      DATABASE_USERNAME_SITE: test
      DATABASE_PASSWORD_SITE: test
      DATABASE_DBNAME_SITE: testdb

      # Stub values required by config validation
      SERVER_SECRET: test-secret-for-ci-only
      SERVER_MODE: test

      # RustFS / S3-compatible storage
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: pkg
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: rustfsadmin
      STORAGE_SECRET_KEY: rustfsadmin
      STORAGE_FORCE_PATH_STYLE: "true"

      # CGO is needed for SQLite and the race detector.
      CGO_ENABLED: "1"
      GOFLAGS: ""

    # Install gcc (CGO / race), run tests with race+coverage, then benchmarks.
    # Write logs then cat so the go test exit code is preserved (ash has no pipefail).
    command: >
      sh -c "
        set -e ;
        apk add --no-cache gcc musl-dev ;
        echo '──── Tests (race + coverage) ────' ;
        set +e ;
        go test -v -race -count=1 -coverprofile=/app/coverage.out ./... > /tmp/test.out 2>&1 ;
        TEST_EXIT=$$? ;
        set -e ;
        tee /app/test.log < /tmp/test.out ;
        echo '' ;
        echo '──── Coverage summary ────' ;
        if [ -f /app/coverage.out ]; then go tool cover -func=/app/coverage.out | tail -1 ; fi ;
        echo '' ;
        echo '──── Benchmarks ────' ;
        mkdir -p /app/bench ;
        set +e ;
        go test -bench=. -benchmem -count=3 -run='^$$' ./... > /tmp/bench.out 2>&1 ;
        BENCH_EXIT=$$? ;
        set -e ;
        tee /app/bench/docker.txt < /tmp/bench.out ;
        if [ $$TEST_EXIT -ne 0 ]; then exit $$TEST_EXIT ; fi ;
        exit $$BENCH_EXIT
      "

    # Start only after every dependency is confirmed healthy.
    depends_on:
      redis:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  go-mod-cache:
  rustfs-data:
